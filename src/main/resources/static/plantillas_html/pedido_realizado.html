<!-- Pedido realizado: lo pinta js/tienda/pedido.js al confirmar (#confirmar_pedido).
     El logo es el de fragments/tienda.html (Mustache no puede usar th:replace): sus agujas
     llegan a las 10:10 al entrar (estilos/compra.html). El botón usa data-accion, como la cabecera -->
<div class="py-10 text-center">
    <svg class="logo-reloj cierre-reloj mx-auto text-principal" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="20" class="fill-white stroke-current" stroke-width="3"/>
        <line x1="24" y1="7.5" x2="24" y2="10.5" class="stroke-principal" stroke-width="2"/>
        <line x1="40.5" y1="24" x2="37.5" y2="24" class="stroke-principal" stroke-width="2"/>
        <line x1="24" y1="40.5" x2="24" y2="37.5" class="stroke-principal" stroke-width="2"/>
        <line x1="7.5" y1="24" x2="10.5" y2="24" class="stroke-principal" stroke-width="2"/>
        <line x1="24" y1="24" x2="14.5" y2="18" class="cierre-horas stroke-acento" stroke-width="3.6" stroke-linecap="round"/>
        <line x1="24" y1="24" x2="37" y2="14" class="cierre-minutos stroke-acento" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="3" class="fill-principal"/>
    </svg>
    {{#NUMERO}}<p class="etiqueta-pequena mt-6">{{NUMERO}}</p>{{/NUMERO}}
    <h2 class="titulo-seccion mt-2">{{t.realizado_titulo}}</h2>
    <p class="texto-ayuda mx-auto max-w-md">{{t.realizado_texto}}</p>
    <a href="#" data-accion="ver_relojes" class="btn btn-primario mt-7">{{t.seguir_comprando}}</a>
</div>
