<!-- Formulario de registro: se inserta dentro de #contenedor -->
<div class="barra-seccion">
    <div>
        <h1 class="titulo-seccion">{{t.registro_titulo}}</h1>
        <p class="texto-ayuda">{{t.registro_texto}}</p>
    </div>
</div>

<form id="form_registro_usuario" class="formulario">

    <div class="grupo">
        <label for="nombre" class="etiqueta">{{t.nombre}}</label>
        <input type="text" id="nombre" name="nombre" autocomplete="given-name" class="campo">
    </div>

    <div class="grupo">
        <label for="apellidos" class="etiqueta">{{t.apellidos}}</label>
        <input type="text" id="apellidos" name="apellidos" autocomplete="family-name" class="campo">
    </div>

    <div class="grupo">
        <label for="email" class="etiqueta">{{t.email}}</label>
        <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" class="campo">
    </div>

    <div class="grupo">
        <label for="pass" class="etiqueta">{{t.contrasena}}</label>
        <input type="password" id="pass" name="pass" autocomplete="new-password" class="campo">
    </div>

    <div class="grupo">
        <label for="telefono" class="etiqueta">{{t.telefono}}</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" inputmode="tel" class="campo">
    </div>

    <div class="grupo md:col-span-2">
        <label for="avatar" class="etiqueta">{{t.avatar_opcional}}</label>
        <div class="flex items-center gap-4">
            <!-- Vista previa: js/tienda/sesion.js pone aquí la foto elegida antes de enviarla -->
            <span class="vista-previa-avatar" aria-hidden="true">
                <img id="vista_previa_avatar" alt="" hidden>
            </span>
            <input type="file" id="avatar" name="avatar" accept="image/jpeg,image/png" aria-describedby="ayuda_avatar"
                   class="campo-archivo min-w-0">
        </div>
        <p id="ayuda_avatar" class="text-sm text-texto-atenuado">{{t.avatar_ayuda}}</p>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 border-t border-borde pt-5 md:col-span-2">
        <a href="#" data-accion="identificarme" class="enlace-texto">{{t.con_cuenta}}</a>
        <button type="submit" class="btn btn-primario ml-auto">{{t.registrarse}}</button>
    </div>
</form>
