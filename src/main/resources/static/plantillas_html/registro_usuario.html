<!-- Formulario de registro: se inserta dentro de #contenedor -->
<div class="barra-seccion">
    <div>
        <h2 class="titulo-seccion">Crea tu cuenta</h2>
        <p class="texto-ayuda">Introduce tus datos para registrarte.</p>
    </div>
</div>

<form id="form_registro_usuario" class="formulario">

    <div class="grupo">
        <label for="nombre" class="etiqueta">Nombre</label>
        <input type="text" id="nombre" name="nombre" autocomplete="given-name" class="campo">
    </div>

    <div class="grupo">
        <label for="apellidos" class="etiqueta">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" autocomplete="family-name" class="campo">
    </div>

    <div class="grupo">
        <label for="email" class="etiqueta">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" class="campo">
    </div>

    <div class="grupo">
        <label for="pass" class="etiqueta">Contraseña</label>
        <input type="password" id="pass" name="pass" autocomplete="new-password" class="campo">
    </div>

    <div class="grupo">
        <label for="telefono" class="etiqueta">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" autocomplete="tel" inputmode="tel" class="campo">
    </div>

    <div class="grupo md:col-span-2">
        <label for="avatar" class="etiqueta">Avatar (opcional)</label>
        <div class="flex items-center gap-4">
            <!-- Vista previa: tienda.js pone aquí la foto elegida antes de enviarla -->
            <span class="vista-previa-avatar" aria-hidden="true">
                <img id="vista_previa_avatar" alt="" hidden>
            </span>
            <input type="file" id="avatar" name="avatar" accept="image/jpeg,image/png" aria-describedby="ayuda_avatar"
                   class="campo-archivo min-w-0">
        </div>
        <p id="ayuda_avatar" class="text-sm text-texto-atenuado">JPG o PNG, hasta 5 MB. Se recorta en cuadrado.</p>
    </div>

    <div class="flex justify-end border-t border-borde pt-5 md:col-span-2">
        <button type="submit" class="btn btn-primario">Registrarse</button>
    </div>
</form>
