<!-- Checkout · paso 2: pago. El botón lo recoge tienda.js (#aceptar_paso_2) -->
<div class="barra-seccion">
    <div>
        <h2 class="titulo-seccion">{{t.pago_titulo}}</h2>
        <p class="texto-ayuda">{{t.pago_texto}}</p>
    </div>
</div>

<ol class="pasos-pedido" aria-label="{{t.pasos_pedido}}">
    <li class="hecho">{{t.paso_envio}}</li>
    <li aria-current="step">{{t.paso_pago}}</li>
    <li>{{t.paso_opinion}}</li>
    <li>{{t.paso_resumen}}</li>
</ol>

<form class="formulario" novalidate>
    <div class="grupo">
        <label for="tipo_tarjeta" class="etiqueta">{{t.pago_tipo}}</label>
        <select id="tipo_tarjeta" class="campo">
            <option value="0">{{t.pago_elegir_tipo}}</option>
            <option value="visa">VISA</option>
            <option value="mastercard">MasterCard</option>
        </select>
    </div>
    <div class="grupo">
        <label for="numero_tarjeta" class="etiqueta">{{t.pago_numero}}</label>
        <input type="text" id="numero_tarjeta" autocomplete="cc-number" inputmode="numeric" class="campo">
    </div>
    <div class="grupo">
        <label for="titular_tarjeta" class="etiqueta">{{t.pago_titular}}</label>
        <input type="text" id="titular_tarjeta" autocomplete="cc-name" class="campo">
    </div>
    <div class="grupo">
        <label for="caducidad_tarjeta" class="etiqueta">{{t.pago_caducidad}}</label>
        <input type="text" id="caducidad_tarjeta" autocomplete="cc-exp" placeholder="{{t.pago_formato}}" class="campo">
    </div>
    <div class="flex justify-end border-t border-borde pt-5 md:col-span-2">
        <button type="button" id="aceptar_paso_2" class="btn btn-primario">{{t.continuar}}</button>
    </div>
</form>
