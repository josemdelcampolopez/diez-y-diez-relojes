<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <!-- Favicon «Diez y Diez»: mismo dibujo que el logo de fragments/tienda.html.
         Los colores van escritos a mano porque el navegador carga este fichero solo, sin Tailwind -->
    <circle cx="24" cy="24" r="20" fill="#ffffff" stroke="#1f4a3c" stroke-width="3"/>
    <!-- Marcas de las 12, 3, 6 y 9 -->
    <line x1="24" y1="7.5" x2="24" y2="10.5" stroke="#1f4a3c" stroke-width="2"/>
    <line x1="40.5" y1="24" x2="37.5" y2="24" stroke="#1f4a3c" stroke-width="2"/>
    <line x1="24" y1="40.5" x2="24" y2="37.5" stroke="#1f4a3c" stroke-width="2"/>
    <line x1="7.5" y1="24" x2="10.5" y2="24" stroke="#1f4a3c" stroke-width="2"/>
    <!-- Agujas a las 10:10 -->
    <line x1="24" y1="24" x2="14.5" y2="18" stroke="#c3362b" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="37" y2="14" stroke="#c3362b" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3" fill="#1f4a3c"/>
</svg>