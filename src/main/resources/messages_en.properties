# ===== VALIDACIONES (las usa message = "{clave}" en los modelos) =====
val_email_obligatorio = The email is required
val_email_tamano = The email is required and must have between 3 and 40 characters
val_email_formato = The email can only contain letters and numbers
val_pass_obligatoria = The password is required
val_pass_tamano = The password is required and must have between 10 and 40 characters
val_pass_formato = The password can only contain letters, numbers and allowed symbols
val_nombre_obligatorio = The first name is required
val_nombre_tamano = The first name is required and must have between 2 and 40 characters
val_nombre_formato = The first name can only contain letters, spaces and hyphens
val_apellidos_obligatorios = The last name is required
val_apellidos_formato = The last name can only contain letters, spaces and hyphens (2 to 60)
val_telefono_obligatorio = The phone number is required
val_telefono_formato = The phone number can only contain digits and an optional + at the start (8 to 15 digits). No spaces.
val_cat_nombre_tamano = The category name is required and must have between 3 and 40 characters
val_cat_nombre_formato = The category name can only contain letters, numbers and spaces
val_cat_desc_tamano = The category description is required and must have between 5 and 200 characters
val_cat_desc_formato = The category description can only contain letters, numbers and spaces
val_marca_tamano = The brand is required and must have between 3 and 40 characters
val_marca_formato = The brand can only contain letters, numbers and spaces
val_modelo_tamano = The model is required and must have between 3 and 40 characters
val_modelo_formato = The model can only contain letters, numbers and spaces
val_precio_min = Minimum price 1 euro
val_precio_max = The maximum price is 99999 euros
val_stock_min = The stock cannot be negative
val_stock_max = The maximum stock is 999 units
val_movimiento_tamano = The movement type is required and must have between 3 and 40 characters
val_movimiento_formato = The movement type can only contain letters, numbers and spaces
val_agua_min = Minimum water resistance 1 atm
val_agua_max = The maximum water resistance is 1000 atm
val_genero_tamano = The gender is required and must have between 3 and 40 characters
val_genero_formato = The gender can only contain letters and spaces
val_sku_tamano = The SKU must have exactly 9 characters
val_sku_formato = The SKU must have 6 capital letters and 3 numbers, for example TISEVE001
