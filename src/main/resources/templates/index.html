<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/tienda :: head(#{nav_relojes})}"></head>
<body class="pagina">
<style th:replace="~{fragments/despiece :: estilos}"></style>

<!-- ===== SALTAR AL CONTENIDO (solo visible con el foco del teclado) ===== -->
<a href="#contenedor" th:text="#{saltar_contenido}"
   class="sr-only rounded-sm bg-fondo px-4 py-3 font-semibold text-principal focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-principal"></a>

<!-- ===== CABECERA FIJA =====
     Aspecto: fragments/tienda.html · Abrir, cerrar y compactar: js/cabecera.js
     Cada data-accion tiene su función en js/tienda.js -->
<header id="cabecera" class="cabecera-tienda">
    <div class="contenedor cabecera-fila">

        <!-- Logo: vuelve al listado -->
        <a href="" data-accion="inicio" class="cabecera-logo">
            <svg th:replace="~{fragments/tienda :: logo}"></svg>
            Diez y Diez
        </a>

        <!-- Menú principal: en el móvil se pliega tras el botón de hamburguesa -->
        <nav id="menu" class="cabecera-menu" th:aria-label="#{nav_principal}">
            <a href="#" data-accion="ver_relojes" class="nav-enlace" th:text="#{nav_relojes}"></a>
            <a href="#" data-accion="carrito" class="nav-enlace">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 8h12l-1 12H7z"/>
                    <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
                </svg>
                [[#{nav_carrito}]]
            </a>
            <a href="admin/inicioAdmin" class="cabecera-admin" th:title="#{nav_admin}">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="15" r="4"/>
                    <path d="M11 12l9-9"/>
                    <path d="M16 7l3 3"/>
                </svg>
                <span class="lg:sr-only" th:text="#{nav_admin}"></span>
            </a>
            <div th:replace="~{fragments/tienda :: idiomas}"></div>
            <a href="#" data-accion="identificarme" class="nav-enlace solo-anonimo" th:text="#{nav_identificarme}"></a>
            <a href="#" data-accion="registrarme" class="btn btn-claro solo-anonimo" th:text="#{nav_registrarme}"></a>
        </nav>

        <!-- Usuario identificado: avatar con su inicial y desplegable (solo con sesión) -->
        <div class="cabecera-usuario solo-sesion">
            <button type="button" id="boton_usuario" class="usuario-boton" aria-expanded="false" aria-controls="menu_usuario">
                <span class="avatar" aria-hidden="true">
                    <span id="avatar_inicial"></span>
                    <img id="avatar_foto" class="avatar-foto" alt="" hidden>
                </span>
                <span id="nombre_usuario" class="sr-only sm:not-sr-only"></span>
                <svg class="flecha h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </button>
            <div id="menu_usuario" class="menu-usuario" hidden>
                <a href="#" data-accion="pedidos" class="menu-usuario-enlace" th:text="#{menu_mis_pedidos}"></a>
                <a href="#" data-accion="mis_datos" class="menu-usuario-enlace" th:text="#{menu_mis_datos}"></a>
                <hr class="my-1 border-borde">
                <a href="#" data-accion="cerrar_sesion" class="menu-usuario-enlace" th:text="#{menu_cerrar_sesion}"></a>
            </div>
        </div>

        <!-- Hamburguesa (solo móvil) -->
        <button type="button" id="boton_menu" class="cabecera-hamburguesa" aria-expanded="false" aria-controls="menu"
                th:aria-label="#{menu_abrir}">
            <svg class="icono-abrir h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <svg class="icono-cerrar h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
        </button>
    </div>
</header>

<div class="cuerpo-tienda">

    <!-- ===== HERO DE PORTADA (solo se ve con el listado: lo oculta pintar() en tienda.js) ===== -->
    <!-- #portada es alta; .portada-fija se queda quieta mientras la recorres y el reloj se despieza.
         Reloj, azar y scroll: js/despiece.js · CSS: fragments/despiece.html -->
    <section id="portada" class="portada">
        <div class="portada-fija">
            <div class="contenedor portada-rejilla">
                <div class="portada-texto">
                    <p class="portada-antetitulo" th:text="#{portada_antetitulo}"></p>
                    <h1 class="portada-titulo" th:utext="#{portada_titulo}"></h1>
                    <p class="portada-explicacion" th:text="#{portada_explicacion}"></p>
                    <div class="portada-acciones">
                        <a href="#contenedor" class="btn btn-primario" th:text="#{ver_relojes}"></a>
                    </div>
                </div>

                <!-- La foto se ve al instante y es la alternativa si no hay 3D; despiece.js pone cuál -->
                <div class="despiece-hueco">
                    <img class="despiece-foto" alt="" width="1024" height="1024">
                </div>
            </div>

            <canvas id="lienzo_despiece" aria-hidden="true"></canvas>
            <p id="nombre_pieza" aria-hidden="true"></p>
            <!-- Para lectores de pantalla: las piezas, sin depender del scroll -->
            <ol id="lista_piezas" class="sr-only" th:aria-label="#{portada_piezas}"></ol>

            <!-- Cierre: el reloj que acabas de desmontar. Precio y botón solo si está a la venta (despiece.js) -->
            <div class="contenedor portada-rejilla portada-cierre">
                <div class="portada-cierre-texto">
                    <p id="cierre_marca" class="portada-antetitulo"></p>
                    <h2 id="cierre_modelo" class="portada-titulo"></h2>
                    <p id="cierre_precio" class="precio" hidden></p>
                    <div class="portada-acciones">
                        <button id="cierre_ver" type="button" class="btn btn-primario" th:text="#{portada_ver_reloj}" hidden></button>
                        <a href="#contenedor" class="btn btn-secundario" th:text="#{ver_relojes}"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== AQUÍ SE PINTA CADA PANTALLA (SPA) ===== -->
    <main>
        <div id="contenedor" class="contenedor panel min-h-56" aria-live="polite"></div>
    </main>
</div>

<!-- Aviso flotante: lo rellena avisar() en tienda.js y se vacía solo. Vacío no se ve.
     role="status" hace que el lector de pantalla lea cada mensaje nuevo -->
<p id="aviso" class="aviso" role="status"></p>

<!-- ===== PIE DE PÁGINA (estilos en fragments/tienda.html)
     Los data-accion funcionan igual que en la cabecera: los recoge el mismo evento de tienda.js -->
<footer id="pie" class="pie-tienda">
    <div class="contenedor pie-fila">
        <div>
            <a href="" data-accion="inicio" class="cabecera-logo">
                <svg th:replace="~{fragments/tienda :: logo}"></svg>
                Diez y Diez
            </a>
            <p class="pie-texto" th:text="#{pie_texto}"></p>
        </div>
        <nav th:aria-label="#{pie_enlaces}">
            <h2 class="pie-titulo" th:text="#{pie_tienda}"></h2>
            <ul class="pie-lista">
                <li><a href="#" data-accion="ver_relojes" class="pie-enlace" th:text="#{nav_relojes}"></a></li>
                <li><a href="#" data-accion="carrito" class="pie-enlace" th:text="#{nav_carrito}"></a></li>
                <li><a href="admin/inicioAdmin" class="pie-enlace" th:text="#{nav_admin}"></a></li>
            </ul>
        </nav>
        <div>
            <h2 class="pie-titulo" th:text="#{pie_visitanos}"></h2>
            <address class="pie-lista not-italic">
                <p>Calle del Reloj 10, 28010 Madrid</p>
                <p th:text="#{pie_horario}"></p>
                <p>910 10 10 10</p>
                <p>hola@diezydiez.example</p>
            </address>
        </div>
    </div>
    <p class="contenedor pie-legal" th:text="#{pie_legal}"></p>
</footer>

<script src="librerias_js/jquery.js"></script>
<script src="librerias_js/mustache.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
<script src="js/cabecera.js"></script>
<script src="js/carrusel.js"></script>
<script src="js/tienda.js"></script>
<!-- Three.js solo se descarga si despiece.js decide usar el 3D -->
<script type="importmap">
    {"imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }}
</script>
<script type="module" src="js/despiece.js"></script>
</body>
</html>
