<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head('Acceso a administración')}"></head>
<body class="pagina login">
<main class="w-full max-w-sm">
    <p class="lateral-marca mb-4 flex justify-center">
        <svg th:replace="~{fragments/tienda :: logo}"></svg>
        Diez y Diez
    </p>
    <form action="admin/inicioAdmin" method="post" class="hoja grid gap-5">
        <h1 class="titulo-bloque">Administración</h1>
        <p th:if="${param.error}" class="aviso-error mt-0" role="alert">Contraseña incorrecta.</p>
        <div class="grupo">
            <label for="pass-login-admin" class="etiqueta">Contraseña</label>
            <input id="pass-login-admin" type="password" name="pass-login-admin" autocomplete="current-password" required autofocus class="campo">
        </div>
        <button type="submit" class="btn btn-primario w-full">Entrar</button>
        <a href="/" class="enlace-bloque inline-flex min-h-11 items-center justify-self-center">Volver a la tienda</a>
    </form>
    <div class="mt-4 flex justify-center text-fondo">
        <div th:replace="~{fragments/tienda :: idiomas}"></div>
    </div>
</main>
</body>
</html>
