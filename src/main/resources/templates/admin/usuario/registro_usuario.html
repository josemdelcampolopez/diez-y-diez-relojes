<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head('Nuevo cliente')}"></head>
<body class="pagina">
<main class="contenedor">

    <header th:replace="~{fragments/general :: cabecera('Nuevo cliente', null)}"></header>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('clientes')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <div class="caja">
            <form th:action="@{/admin/guardarUsuario}" th:object="${nuevoUsuario}" method="post" class="formulario">

                <div class="grupo md:col-span-2">
                    <label for="email" class="etiqueta">Email</label>
                    <input type="email" th:field="*{email}" aria-describedby="error_email" class="campo">
                    <span id="error_email" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
                </div>

                <div class="grupo">
                    <label for="nombre" class="etiqueta">Nombre</label>
                    <input type="text" th:field="*{nombre}" aria-describedby="error_nombre" class="campo">
                    <span id="error_nombre" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></span>
                </div>

                <div class="grupo">
                    <label for="apellidos" class="etiqueta">Apellidos</label>
                    <input type="text" th:field="*{apellidos}" aria-describedby="error_apellidos" class="campo">
                    <span id="error_apellidos" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error"></span>
                </div>

                <div class="grupo">
                    <label for="telefono" class="etiqueta">Teléfono</label>
                    <input type="tel" th:field="*{telefono}" aria-describedby="error_telefono" class="campo">
                    <span id="error_telefono" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></span>
                </div>

                <div class="grupo">
                    <label for="pass" class="etiqueta">Contraseña</label>
                    <input type="password" th:field="*{pass}" autocomplete="new-password" aria-describedby="error_pass" class="campo">
                    <span id="error_pass" th:if="${#fields.hasErrors('pass')}" th:errors="*{pass}" class="error"></span>
                </div>

                <div class="flex flex-wrap justify-end gap-3 border-t border-borde pt-5 md:col-span-2">
                    <a th:href="@{/admin/gestionarUsuarios}" class="btn btn-neutro">Cancelar</a>
                    <button type="submit" class="btn btn-primario">Crear cliente</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
