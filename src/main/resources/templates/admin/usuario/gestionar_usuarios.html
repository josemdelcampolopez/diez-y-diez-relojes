<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_clientes})}"></head>
<body class="pagina">
<main class="contenedor">

    <div class="bloque-cabecera items-center">
        <header th:replace="~{fragments/general :: cabecera(#{adm_clientes}, null)}"></header>
        <a href="registrarUsuario" class="btn btn-primario shrink-0" th:text="#{adm_cli_nuevo}"></a>
    </div>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('clientes')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <p th:if="${error}" th:text="${error}" class="aviso-error"></p>
        <p th:if="${#lists.isEmpty(usuarios)}" class="vacio" th:text="#{adm_cli_vacio}"></p>

        <div th:unless="${#lists.isEmpty(usuarios)}" class="mt-4 overflow-x-auto">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col" th:text="#{adm_cliente}"></th>
                    <th scope="col" class="hidden md:table-cell" th:text="#{email}"></th>
                    <th scope="col" class="hidden xl:table-cell" th:text="#{telefono}"></th>
                    <th scope="col" class="derecha" th:text="#{adm_pedidos}"></th>
                    <th scope="col" class="derecha hidden sm:table-cell" th:text="#{adm_gastado}"></th>
                    <th scope="col"><span class="sr-only" th:text="#{adm_acciones}"></span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="cliente">
                        <span class="font-medium" th:text="|${u['NOMBRE']} ${u['APELLIDOS']}|">Nombre Apellidos</span>
                        <!-- En el móvil no hay columna Email: va debajo del nombre -->
                        <span class="block break-all text-sm text-texto-atenuado md:hidden" th:text="${u['EMAIL']}">email</span>
                    </td>
                    <td class="hidden md:table-cell" th:text="${u['EMAIL']}">email</td>
                    <td class="hidden xl:table-cell" th:text="${u['TELEFONO']}">teléfono</td>
                    <td class="derecha" th:text="${u['PEDIDOS']}">0</td>
                    <td class="derecha hidden sm:table-cell"
                        th:text="${#numbers.formatDecimal(u['GASTADO'], 1, 'POINT', 2, 'COMMA') + ' €'}">0 €
                    </td>
                    <td>
                        <div class="acciones-fila">
                            <a th:href="@{editarUsuario(id=${u['ID']})}"
                               th:aria-label="|${#messages.msg('adm_editar')}: ${u['NOMBRE']} ${u['APELLIDOS']}|" th:text="#{adm_editar}"></a>
                            <a th:href="@{borrarUsuario(id=${u['ID']})}"
                               th:aria-label="|${#messages.msg('borrar')}: ${u['NOMBRE']} ${u['APELLIDOS']}|" th:text="#{borrar}"
                               class="borrar" th:data-confirmar="#{adm_cli_confirmar}" onclick="return confirm(this.dataset.confirmar)"></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
