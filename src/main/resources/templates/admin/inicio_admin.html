<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_inicio})}"></head>
<body class="pagina">
<main class="contenedor">

    <header th:replace="~{fragments/general :: cabecera(#{adm_inicio}, null)}"></header>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('inicio')}"></nav>

        <!-- .![...] saca una columna de cada fila y #aggregates.sum la suma -->
        <div class="inicio" th:with="ingresos=${#aggregates.sum(ventas.![#this['INGRESOS']])},
                                     pedidos=${#aggregates.sum(ventas.![#this['PEDIDOS']])}">

            <!-- ===== VENTAS ===== -->
            <section class="hoja" th:aria-label="#{adm_ventas}">
                <dl class="cifras">
                    <div>
                        <dt th:text="#{adm_ingresos_14}"></dt>
                        <dd class="cifra-grande" th:text="|${#numbers.formatDecimal(ingresos, 1, 'POINT', 0, 'COMMA')} €|">0 €</dd>
                    </div>
                    <div>
                        <dt th:text="#{adm_pedidos}"></dt>
                        <dd th:text="${pedidos}">0</dd>
                    </div>
                    <div>
                        <dt th:text="#{adm_ticket}"></dt>
                        <dd th:text="${pedidos > 0 ? #numbers.formatDecimal(ingresos / pedidos, 1, 'POINT', 0, 'COMMA') + ' €' : '—'}">0 €</dd>
                    </div>
                </dl>

                <ol class="grafica" th:aria-label="#{adm_grafica}">
                    <li th:each="v : ${ventas}"
                        th:with="detalle=|${v['FECHA']}: ${v['PEDIDOS']} ${#messages.msg('adm_pedidos_min')}, ${#numbers.formatDecimal(v['INGRESOS'], 1, 'POINT', 2, 'COMMA')} €|"
                        th:title="${detalle}">
                        <span class="grafica-columna" aria-hidden="true">
                            <span class="grafica-barra" th:style="|height: ${v['ALTURA']}%|"></span>
                        </span>
                        <span aria-hidden="true" th:text="${v['DIA_MES']}">1</span>
                        <span class="sr-only" th:text="${detalle}">detalle</span>
                    </li>
                </ol>
            </section>

            <!-- ===== POR RESOLVER ===== -->
            <aside>
                <h2 class="titulo-bloque" th:text="#{adm_por_resolver}"></h2>
                <p th:if="${#lists.isEmpty(incidencias) and #lists.isEmpty(stockBajo)}" class="texto-ayuda" th:text="#{adm_sin_resolver}"></p>

                <div th:unless="${#lists.isEmpty(incidencias)}" class="resolver-grupo">
                    <h3 class="resolver-titulo">
                        <span class="resolver-urgente" th:text="${#lists.size(incidencias)}">0</span>
                        <span th:text="${#lists.size(incidencias) == 1} ? #{adm_incidencia} : #{adm_incidencias}">incidencias</span>
                    </h3>
                    <a th:each="p : ${incidencias}" th:href="@{verDetallesPedido(id=${p.id})}"
                       th:aria-label="|${#messages.msg('adm_ver_pedido')} ${p.id}: ${p.nombreCompleto}|" class="resolver-fila">
                        <span class="min-w-0 truncate" th:text="${p.nombreCompleto}">Cliente</span>
                        <span class="tabular-nums text-texto-atenuado" th:text="${p.id}">0</span>
                    </a>
                </div>

                <div th:unless="${#lists.isEmpty(stockBajo)}" class="resolver-grupo">
                    <h3 class="resolver-titulo" th:text="#{adm_stock_bajo}"></h3>
                    <a th:each="r : ${stockBajo}" th:href="@{editarReloj(id=${r['ID']})}" class="resolver-fila">
                        <span class="min-w-0 truncate" th:text="|${r['MARCA_RELOJ']} ${r['MODELO']}|">Reloj</span>
                        <span class="whitespace-nowrap tabular-nums text-texto-atenuado" th:text="|${r['STOCK']} ${#messages.msg('adm_uds')}|">0 uds.</span>
                    </a>
                </div>
            </aside>

            <!-- ===== ÚLTIMOS PEDIDOS ===== -->
            <section class="min-w-0">
                <div class="bloque-cabecera">
                    <h2 class="titulo-bloque" th:text="#{adm_ultimos}"></h2>
                    <a href="gestionarPedidos" class="enlace-bloque" th:text="#{adm_ver_todos}"></a>
                </div>
                <p th:if="${#lists.isEmpty(ultimosPedidos)}" class="texto-ayuda" th:text="#{adm_ped_vacio}"></p>
                <div th:unless="${#lists.isEmpty(ultimosPedidos)}" class="overflow-x-auto">
                    <table class="tabla">
                        <thead>
                        <tr>
                            <th scope="col" th:text="#{adm_pedido}"></th>
                            <th scope="col" th:text="#{adm_cliente}"></th>
                            <th scope="col" class="hidden xl:table-cell" th:text="#{adm_fecha}"></th>
                            <th scope="col" class="derecha" th:text="#{adm_importe}"></th>
                            <th scope="col" th:text="#{adm_estado}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${ultimosPedidos}">
                            <td><a th:href="@{verDetallesPedido(id=${p.id})}" th:text="${p.id}"
                                   th:aria-label="|${#messages.msg('adm_ver_pedido')} ${p.id}|">0</a></td>
                            <td class="cliente" th:text="${p.nombreCompleto}">Cliente</td>
                            <!-- Los pedidos anteriores al paso 2 no tienen fecha -->
                            <td class="hidden xl:table-cell"
                                th:text="${p.fecha != null ? #temporals.format(p.fecha, 'd/M HH:mm') : '—'}">—</td>
                            <td class="derecha"
                                th:text="${#lists.isEmpty(p.productosPedido) ? '—' : #numbers.formatDecimal(#aggregates.sum(p.productosPedido.![cantidad * reloj.precio]), 1, 'POINT', 2, 'COMMA') + ' €'}">0 €</td>
                            <td><span class="chapa" th:data-estado="${p.estado}"
                                      th:text="#{${'estado_' + p.estado}}">estado</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- ===== MÁS VENDIDOS ===== -->
            <section>
                <h2 class="titulo-bloque mb-2" th:text="#{adm_mas_vendidos}"></h2>
                <p th:if="${#lists.isEmpty(masVendidos)}" class="texto-ayuda" th:text="#{adm_sin_ventas}"></p>
                <ol>
                    <li th:each="m : ${masVendidos}" class="vendido">
                        <img th:src="@{/mostrar_miniatura(id=${m['ID']})}" alt="" width="48" height="48" loading="lazy">
                        <p class="min-w-0 flex-1 truncate text-texto" th:text="|${m['MARCA_RELOJ']} ${m['MODELO']}|">Reloj</p>
                        <p class="whitespace-nowrap tabular-nums text-texto-atenuado" th:text="|${m['UNIDADES']} ${#messages.msg('adm_uds')}|">0 uds.</p>
                    </li>
                </ol>
            </section>
        </div>
    </section>
</main>
</body>
</html>
