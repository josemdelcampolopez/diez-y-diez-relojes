<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{nav_relojes})}"></head>
<body class="pagina">
<main class="contenedor">

    <div class="bloque-cabecera items-center">
        <header th:replace="~{fragments/general :: cabecera(#{nav_relojes}, null)}"></header>
        <a href="registrarReloj" class="btn btn-primario shrink-0" th:text="#{adm_rel_nuevo}"></a>
    </div>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('relojes')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <form action="gestionarRelojes" class="flex flex-wrap items-end gap-3">
            <label class="grid gap-1">
                <span th:text="#{adm_rel_buscar}"></span>
                <input type="text" name="busqueda" th:value="${busqueda}" class="campo">
            </label>
            <input type="submit" th:value="#{adm_buscar}" class="btn btn-secundario">
        </form>
        <p th:if="${error}" th:text="${error}" class="aviso-error"></p>
        <p th:if="${#lists.isEmpty(relojes)}" class="vacio" th:text="#{adm_rel_vacio}"></p>

        <div th:unless="${#lists.isEmpty(relojes)}" class="mt-4 overflow-x-auto">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col" th:text="#{adm_reloj}"></th>
                    <th scope="col" class="hidden md:table-cell" th:text="#{adm_categoria}"></th>
                    <th scope="col" class="derecha hidden sm:table-cell" th:text="#{adm_precio}"></th>
                    <th scope="col" class="derecha" th:text="#{adm_stock}"></th>
                    <th scope="col"><span class="sr-only" th:text="#{adm_acciones}"></span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${relojes}">
                    <td class="cliente">
                        <div class="reloj-celda">
                            <img th:src="@{/mostrar_miniatura(id=${r.id})}" alt="" width="48" height="48" loading="lazy">
                            <div class="min-w-0">
                                <span class="font-medium" th:text="|${r.marca} ${r.modelo}|">Marca Modelo</span>
                                <!-- En el móvil no hay columna Precio: va debajo del nombre -->
                                <span class="block text-sm text-texto-atenuado sm:hidden"
                                      th:text="${#numbers.formatDecimal(r.precio, 1, 'POINT', 2, 'COMMA') + ' €'}">0 €</span>
                            </div>
                        </div>
                    </td>
                    <td class="hidden md:table-cell" th:text="${r.categoria.nombre}">Categoría</td>
                    <td class="derecha hidden sm:table-cell"
                        th:text="${#numbers.formatDecimal(r.precio, 1, 'POINT', 2, 'COMMA') + ' €'}">0 €</td>
                    <!-- Stock bajo: el mismo límite de 5 que el panel de inicio -->
                    <td class="derecha">
                        <span th:classappend="${r.stock le 5} ? 'resolver-urgente'"
                              th:text="${r.stock == 0} ? #{adm_agotado} : ${r.stock}">0</span>
                    </td>
                    <td>
                        <div class="acciones-fila">
                            <a th:href="@{editarReloj(id=${r.id})}" th:aria-label="|${#messages.msg('adm_editar')}: ${r.marca} ${r.modelo}|" th:text="#{adm_editar}"></a>
                            <a th:href="@{borrarReloj(id=${r.id})}" th:aria-label="|${#messages.msg('borrar')}: ${r.marca} ${r.modelo}|" th:text="#{borrar}"
                               class="borrar" th:data-confirmar="#{adm_rel_confirmar}" onclick="return confirm(this.dataset.confirmar)"></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
