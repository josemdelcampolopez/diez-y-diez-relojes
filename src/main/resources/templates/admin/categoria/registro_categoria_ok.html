<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_cat_creada})}"></head>
<body class="pagina">
<main class="contenedor">

    <header th:replace="~{fragments/general :: cabecera(#{adm_cat_nueva}, null)}"></header>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('categorias')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <div class="caja mx-auto max-w-lg p-8 text-center" role="status">
            <svg class="mx-auto h-12 w-12 text-exito" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <h2 class="titulo-seccion mt-4" th:text="#{adm_cat_registrada}"></h2>
            <h2 class="titulo-seccion mt-4" th:text="#{adm_cat_creada}"></h2>
            <p class="texto-ayuda" th:text="#{adm_cat_asignar}"></p>
        </div>
    </section>
</main>
</body>
</html>
