<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_categorias})}"></head>
<body class="pagina">
<main class="contenedor">

    <div class="bloque-cabecera items-center">
        <header th:replace="~{fragments/general :: cabecera(#{adm_categorias}, null)}"></header>
        <a href="registrarCategoria" class="btn btn-primario shrink-0" th:text="#{adm_cat_nueva}"></a>
    </div>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('categorias')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <p th:if="${error}" th:text="${error}" class="aviso-error"></p>
        <p th:if="${#lists.isEmpty(categorias)}" class="vacio" th:text="#{adm_cat_vacio}"></p>

        <div th:unless="${#lists.isEmpty(categorias)}" class="mt-4 overflow-x-auto">
            <table class="tabla">
                <thead>
                <tr>
                    <th scope="col" th:text="#{adm_categoria}"></th>
                    <th scope="col" class="hidden md:table-cell" th:text="#{adm_descripcion}"></th>
                    <th scope="col" class="derecha" th:text="#{nav_relojes}"></th>
                    <th scope="col"><span class="sr-only" th:text="#{adm_acciones}"></span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}">
                    <td class="cliente">
                        <span class="font-medium" th:text="${c.nombre}">Nombre</span>
                        <!-- En el móvil no hay columna Descripción: va debajo del nombre -->
                        <span class="block text-sm text-texto-atenuado md:hidden"
                              th:text="${c.descripcion}">Descripción</span>
                    </td>
                    <td class="cliente hidden md:table-cell" th:text="${c.descripcion}">Descripción</td>
                    <td class="derecha" th:text="${#lists.size(c.relojes)}">0</td>
                    <td>
                        <div class="acciones-fila">
                            <a th:href="@{editarCategoria(id=${c.id})}" th:aria-label="|${#messages.msg('adm_editar')}: ${c.nombre}|" th:text="#{adm_editar}"></a>
                            <a th:href="@{borrarCategoria(id=${c.id})}" th:aria-label="|${#messages.msg('borrar')}: ${c.nombre}|" th:text="#{borrar}"
                               class="borrar" th:data-confirmar="#{adm_cat_confirmar}" onclick="return confirm(this.dataset.confirmar)"></a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
