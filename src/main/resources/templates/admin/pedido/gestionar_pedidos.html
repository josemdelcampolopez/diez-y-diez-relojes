<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_ped_titulo})}"></head>
<body class="pagina">
<main class="contenedor">

    <header th:replace="~{fragments/general :: cabecera(#{adm_ped_titulo}, #{adm_ped_texto})}"></header>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('pedidos')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <p th:if="${#lists.isEmpty(pedidos)}" class="vacio" th:text="#{adm_ped_vacio}"></p>

        <div th:unless="${#lists.isEmpty(pedidos)}">
            <!-- .?[...] se queda con los pedidos que cumplen la condición -->
            <nav class="filtros" th:aria-label="#{adm_ped_filtrar}">
                <a href="gestionarPedidos" class="filtro" data-estado="">[[#{adm_todos}]]
                    <span th:text="${#lists.size(pedidos)}">0</span></a>
                <a href="gestionarPedidos?estado=Completado" class="filtro" data-estado="Completado">[[#{estado_Completado}]]
                    <span th:text="${#lists.size(pedidos.?[estado == 'Completado'])}">0</span></a>
                <a href="gestionarPedidos?estado=Enviado" class="filtro" data-estado="Enviado">[[#{estado_Enviado}]]
                    <span th:text="${#lists.size(pedidos.?[estado == 'Enviado'])}">0</span></a>
                <a href="gestionarPedidos?estado=Incidencia" class="filtro" data-estado="Incidencia">[[#{estado_Incidencia}]]
                    <span class="resolver-urgente" th:text="${#lists.size(pedidos.?[estado == 'Incidencia'])}">0</span></a>
                <a href="gestionarPedidos?estado=EnProceso" class="filtro" data-estado="EnProceso">[[#{estado_EnProceso}]]
                    <span th:text="${#lists.size(pedidos.?[estado == 'EnProceso'])}">0</span></a>
            </nav>

            <p id="sin-pedidos" class="texto-ayuda hidden" th:text="#{adm_ped_sin_pestana}"></p>

            <div class="overflow-x-auto">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{adm_pedido}"></th>
                        <th scope="col" th:text="#{adm_cliente}"></th>
                        <th scope="col" class="hidden lg:table-cell" th:text="#{adm_fecha}"></th>
                        <th scope="col" class="derecha hidden sm:table-cell" th:text="#{adm_importe}"></th>
                        <th scope="col" class="hidden md:table-cell" th:text="#{adm_estado}"></th>
                        <th scope="col" class="lg:w-60" th:text="#{adm_cambiar_estado}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pedidos}" class="fila-pedido" th:data-estado="${p.estado}">
                        <td><a th:href="@{verDetallesPedido(id=${p.id})}" th:text="${p.id}"
                               th:aria-label="|${#messages.msg('adm_ver_pedido')} ${p.id}|">0</a></td>
                        <!-- ?: pone el texto de la derecha si el pedido aún no tiene datos de envío (sigue en el carrito) -->
                        <td class="cliente" th:text="${p.nombreCompleto} ?: #{adm_sin_envio}">Cliente</td>
                        <td class="hidden lg:table-cell"
                            th:text="${p.fecha != null ? #temporals.format(p.fecha, 'd/M HH:mm') : '—'}">—</td>
                        <td class="derecha hidden sm:table-cell"
                            th:text="${#lists.isEmpty(p.productosPedido) ? '—' : #numbers.formatDecimal(#aggregates.sum(p.productosPedido.![cantidad * reloj.precio]), 1, 'POINT', 2, 'COMMA') + ' €'}">0 €</td>
                        <td class="hidden md:table-cell">
                            <span class="chapa" th:data-estado="${p.estado}"
                                  th:text="#{${'estado_' + p.estado}}">estado</span>
                        </td>
                        <td>
                            <!-- Los carritos a medias no se cambian de estado -->
                            <span th:if="${p.estado == 'EnProceso'}" class="text-sm text-texto-atenuado md:hidden" th:text="#{estado_EnProceso}"></span>
                            <form th:unless="${p.estado == 'EnProceso'}" action="cambiarEstadoPedidoLista" method="post"
                                  class="flex flex-wrap items-center gap-2">
                                <input type="hidden" name="id" th:value="${p.id}">
                                <input type="hidden" name="pestana" value="">
                                <select name="estado" autocomplete="off" class="campo min-h-11 w-auto px-2"
                                        th:data-actual="${p.estado}" th:aria-label="|${#messages.msg('adm_cambiar_estado')}: ${p.id}|">
                                    <option value="Completado" th:selected="${p.estado == 'Completado'}" th:text="#{estado_Completado}"></option>
                                    <option value="Enviado" th:selected="${p.estado == 'Enviado'}" th:text="#{estado_Enviado}"></option>
                                    <option value="Incidencia" th:selected="${p.estado == 'Incidencia'}" th:text="#{estado_Incidencia}"></option>
                                </select>
                                <button type="submit" class="btn btn-primario hidden px-3" th:text="#{adm_guardar}"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<script th:src="@{/librerias_js/jquery.js}"></script>
<script th:src="@{/js/pedidos_admin.js}"></script>
</body>
</html>
