<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(#{adm_detalle_titulo})}"></head>
<body class="pagina">
<main class="contenedor">

    <header th:replace="~{fragments/general :: cabecera(#{adm_detalle_titulo}, #{adm_detalle_texto})}"></header>

    <section class="panel">
        <nav th:replace="~{fragments/general :: menu('pedidos')}"></nav>

        <!-- ===== CONTENIDO DE LA PÁGINA ===== -->
        <div class="barra-seccion mt-6">
            <div>
                <p class="etiqueta-pequena" th:text="|${#messages.msg('adm_pedido')} ${pedido.id}|">0</p>
                <h2 class="titulo-seccion" th:text="${pedido.nombreCompleto} ?: #{adm_sin_envio}">Cliente</h2>
            </div>
            <a href="gestionarPedidos" class="btn btn-neutro" th:text="#{adm_volver_pedidos}"></a>
        </div>

        <!-- Desde lg: datos del pedido a la izquierda (2 de 3 columnas) y estado a la derecha -->
        <div class="mt-6 grid gap-6 lg:grid-cols-3">
            <div class="grid content-start gap-6 md:grid-cols-2 lg:col-span-2">

                <article class="tarjeta-admin p-6">
                    <h3 class="titulo-producto" th:text="#{paso_envio}"></h3>
                    <dl class="lista-datos mt-4">
                        <div><dt th:text="#{adm_cuenta}"></dt><dd class="min-w-0 break-all text-right" th:text="${pedido.usuario.email}">cuenta</dd></div>
                        <div><dt th:text="#{email}"></dt><dd class="min-w-0 break-all text-right" th:text="${pedido.email}">email</dd></div>
                        <div><dt th:text="#{telefono}"></dt><dd th:text="${pedido.telefono}">teléfono</dd></div>
                        <div><dt th:text="#{envio_direccion}"></dt><dd class="min-w-0 text-right" th:text="${pedido.direccion}">dirección</dd></div>
                        <div><dt th:text="#{envio_provincia}"></dt><dd th:text="${pedido.provincia}">provincia</dd></div>
                        <div><dt th:text="#{envio_cp}"></dt><dd th:text="${pedido.codigoPostal}">CP</dd></div>
                    </dl>
                </article>

                <article class="tarjeta-admin p-6">
                    <h3 class="titulo-producto" th:text="#{paso_pago}"></h3>
                    <dl class="lista-datos mt-4">
                        <div><dt th:text="#{adm_titular}"></dt><dd class="min-w-0 text-right" th:text="${pedido.titularTarjeta}">titular</dd></div>
                        <div><dt th:text="#{adm_tarjeta}"></dt><dd th:text="${pedido.tipoTarjeta}">tipo</dd></div>
                        <div><dt th:text="#{adm_numero}"></dt><dd th:text="${pedido.numeroTarjeta?.length() > 4
                                ? '•••• ' + pedido.numeroTarjeta.substring(pedido.numeroTarjeta.length() - 4)
                                : pedido.numeroTarjeta}">•••• 0000</dd></div>
                        <div><dt th:text="#{adm_caducidad}"></dt><dd th:text="${pedido.caducidad}">caducidad</dd></div>
                    </dl>
                </article>

                <!-- Solo si el cliente ha contestado la pregunta extra -->
                <p th:if="${pedido.motivoCompra}" class="caja mt-0 md:col-span-2">
                    <span class="etiqueta-pequena block" th:text="#{adm_motivo}"></span>
                    <span th:text="${pedido.motivoCompra}">motivo</span>
                </p>

                <article class="tarjeta-admin p-6 md:col-span-2">
                    <h3 class="titulo-producto" th:text="#{productos}"></h3>
                    <p th:if="${#lists.isEmpty(pedido.productosPedido)}" class="texto-ayuda" th:text="#{adm_sin_productos}"></p>
                    <ul class="mt-2 divide-y divide-borde">
                        <li th:each="pp : ${pedido.productosPedido}" class="flex items-center gap-4 py-3">
                            <img th:src="@{/mostrar_miniatura(id=${pp.reloj.id})}" alt="" width="64" height="64" loading="lazy"
                                 class="h-16 w-16 shrink-0 rounded-sm bg-fondo object-contain p-1">
                            <div class="min-w-0 flex-1">
                                <p class="marca" th:text="${pp.reloj.marca}">Marca</p>
                                <p class="truncate text-texto" th:text="${pp.reloj.modelo}">Modelo</p>
                            </div>
                            <p class="whitespace-nowrap text-texto-atenuado" th:text="|${pp.cantidad} × ${pp.reloj.precio} €|">1 × 0 €</p>
                        </li>
                    </ul>
                    <!-- .![...] calcula cantidad × precio de cada línea y #aggregates.sum las suma -->
                    <p th:unless="${#lists.isEmpty(pedido.productosPedido)}"
                       class="mt-2 flex justify-between border-t border-borde pt-4 font-serif text-2xl text-texto">
                        <span th:text="#{total}"></span>
                        <span th:text="|${#numbers.formatDecimal(#aggregates.sum(pedido.productosPedido.![cantidad * reloj.precio]), 1, 2)} €|">0 €</span>
                    </p>
                </article>
            </div>

            <!-- ===== ESTADO ===== -->
            <aside class="tarjeta-admin h-fit p-6">
                <h3 class="titulo-producto" th:text="#{adm_estado}"></h3>
                <p class="mt-3"><span class="chapa" th:data-estado="${pedido.estado}"
                                      th:text="#{${'estado_' + pedido.estado}}">estado</span></p>
                <form th:unless="${pedido.estado == 'EnProceso'}" action="cambiarEstadoPedido" method="post" class="mt-4 grid gap-4">
                    <input type="hidden" name="id" th:value="${pedido.id}">
                    <div class="grupo">
                        <label for="estado" class="etiqueta" th:text="#{adm_estado_pedido}"></label>
                        <select id="estado" name="estado" class="campo">
                            <option th:each="e : ${estados}" th:unless="${e.name() == 'EnProceso'}" th:value="${e}"
                                    th:text="#{${'estado_' + e.name()}}"
                                    th:selected="${e.name() == pedido.estado}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primario" th:text="#{adm_guardar_estado}"></button>
                </form>
            </aside>
        </div>
    </section>
</main>
</body>
</html>
